name = "zkverify-gatekeeper"
main = "worker.js"
compatibility_date = "2026-11-14"
workers_dev = true

# Durable seen-set for PROOF_REUSED detection across isolates.
# Created 2026-11-14 via Cloudflare API (custom.cloudflare connector):
# namespace SEEN_PROOFS id b13ff3311e1a4355b03f1b97e840fcb4.
[[kv_namespaces]]
binding = "SEEN_PROOFS"
id = "b13ff3311e1a4355b03f1b97e840fcb4"

[vars]
# AGENT_GAMES_HMAC_SECRET must be set as a SECRET, never here:
#   npx wrangler secret put AGENT_GAMES_HMAC_SECRET
# (value = the 32-byte secret shown once via dashboard "Rotate Secret")
